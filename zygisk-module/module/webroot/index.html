<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AntiHook Bypass 作用域</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --sub:#6e6e73;
  --line:#e3e3e6; --accent:#0a84ff; --ok:#30a14e; --warn:#c46a00; --err:#d1242f;
  --sel:#e8f2ff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1c1c1e; --text:#f2f2f7; --sub:#98989d;
    --line:#2c2c2e; --accent:#0a84ff; --ok:#30d158; --warn:#ff9f0a; --err:#ff453a;
    --sel:#0d2b4d;
  }
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans CJK SC","PingFang SC",sans-serif;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(90px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
h1{font-size:19px;margin:0 0 2px;font-weight:600}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input[type=search]{
  flex:1;min-width:0;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;
  -webkit-appearance:none;
}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{
  font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent;
}
button:active{opacity:.6}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.4}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--sub);font-size:13px;white-space:nowrap;cursor:pointer;
}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:12px;overflow:hidden}
.app{display:flex;align-items:center;gap:12px;padding:11px 13px;background:var(--card);cursor:pointer;-webkit-tap-highlight-color:transparent}
.app.on{background:var(--sel)}
.app:active{opacity:.65}
.icon{width:38px;height:38px;border-radius:9px;flex:0 0 38px;background:var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.icon img{width:100%;height:100%;object-fit:cover;display:block}
.icon span{font-size:17px;color:var(--sub)}
.info{flex:1;min-width:0}
.name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkg{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restart{
  width:32px;height:32px;flex:0 0 32px;border-radius:50%;
  border:1px solid var(--line);background:transparent;color:var(--sub);
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.restart:active{opacity:.5}
.restart:disabled{opacity:.28}
.restart.busy{color:var(--accent);border-color:var(--accent)}
.restart.busy span{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite}
.tick{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
.app.on .tick{background:var(--accent);border-color:var(--accent)}
.tick::after{content:"";width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.app.on .tick::after{opacity:1}
.empty{padding:34px 16px;text-align:center;color:var(--sub);font-size:14px}
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;
}
.count{font-size:13px;color:var(--sub);flex:1}
.msg{
  position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:30;
  padding:11px 14px;border-radius:11px;font-size:13.5px;line-height:1.45;
  background:#1c1c1e;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.28);
  opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none;
}
.msg.show{opacity:1;transform:none}
.msg.err{background:var(--err)}
.msg.ok{background:var(--ok)}
.msg.warn{background:var(--warn)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.note{
  margin:14px 0 0;padding:11px 13px;border-radius:11px;background:var(--card);
  border:1px solid var(--line);font-size:12.5px;color:var(--sub);line-height:1.6;
}
.note b{color:var(--text)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--line);padding:1px 5px;border-radius:4px;color:var(--text)}
</style>
</head>
<body>

<h1>AntiHook Bypass</h1>
<div class="sub" id="head">Zygisk 作用域管理</div>

<div class="bar">
  <input id="q" type="search" placeholder="搜索应用名或包名" autocomplete="off" spellcheck="false">
  <button id="refresh" title="重新读取">↻</button>
</div>

<div class="tabs">
  <div class="tab on" data-f="sel">已选 <span id="n-sel">0</span></div>
  <div class="tab" data-f="run">运行中</div>
  <div class="tab" data-f="sys">系统应用</div>
  <div class="tab" data-f="all">全部 <span id="n-all">0</span></div>
</div>

<div id="list"><div class="empty"><span class="spin"></span>正在读取应用列表…</div></div>

<div class="note">
  <b>改完要重开目标应用才生效。</b><br>
  这里只是把包名写进 <code>scope.txt</code>，不会重编模块，也不需要重启设备。
  但已经在运行的进程不会自动退出，需要你手动关掉再打开那个应用。
</div>

<div class="foot">
  <div class="count" id="cnt">—</div>
  <button id="restart-all" disabled>重启已选</button>
  <button id="save" class="primary" disabled>保存</button>
</div>

<div class="msg" id="msg"></div>

<script>
(function () {
  'use strict';

  var MODULE_ID = 'antihookbypass_zygisk';
  var SCOPE = '/data/adb/modules/' + MODULE_ID + '/scope.txt';

  var all = [];          // {pkg, name, sys, run}
  var selected = {};     // pkg -> true
  var initial = {};      // 用于判断是否有改动
  var filter = 'sel';
  var query = '';
  var loaded = false;

  /*
   * 增量渲染。
   *
   * 这台机器上有 1087 个可列出的包。一次性把它们全塞进 DOM，
   * 真机 WebView 会明显卡顿（布局与绘制都是 O(n)）。
   * 所以先渲染一屏，剩下的点"显示更多"再追加。
   */
  var PAGE = 60;
  var shown = PAGE;

  var $ = function (id) { return document.getElementById(id); };

  function hasKsu() {
    return !!(window.ksu && typeof window.ksu.exec === 'function');
  }

  /* 走 ksU 执行命令，回调式桥包成 Promise */
  function exec(cmd) {
    return new Promise(function (resolve) {
      if (!hasKsu()) { resolve({ code: -1, stdout: '', stderr: 'no ksu bridge' }); return; }
      var cb = 'ahb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      var done = false;
      window[cb] = function (code, stdout, stderr) {
        if (done) return;
        done = true;
        try { delete window[cb]; } catch (e) {}
        resolve({ code: Number(code) || 0, stdout: String(stdout == null ? '' : stdout), stderr: String(stderr == null ? '' : stderr) });
      };
      try {
        window.ksu.exec(cmd, JSON.stringify({}), cb);
      } catch (e) {
        if (!done) { done = true; resolve({ code: -1, stdout: '', stderr: String(e) }); }
      }
      /* 兜底超时，避免桥不回话就永远转圈 */
      setTimeout(function () {
        if (!done) { done = true; resolve({ code: -2, stdout: '', stderr: 'timeout' }); }
      }, 15000);
    });
  }

  /* 单引号安全转义，避免包名里的字符破坏 shell */
  function shq(s) {
    return "'" + String(s).replace(/'/g, "'\\''") + "'";
  }

  function toast(text, kind, ms) {
    var m = $('msg');
    m.textContent = text;
    m.className = 'msg show ' + (kind || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { m.className = 'msg ' + (kind || ''); }, ms || 2600);
  }

  function labelOf(pkg) {
    return (all.filter(function (a) { return a.pkg === pkg; })[0] || {}).name || pkg;
  }

  /* ---------- 读 ---------- */

  function readScope() {
    return exec('cat ' + shq(SCOPE) + ' 2>/dev/null').then(function (r) {
      var out = [];
      r.stdout.split(/\r?\n/).forEach(function (line) {
        var t = line.trim();
        if (!t || t.charAt(0) === '#') return;
        if (out.indexOf(t) < 0) out.push(t);
      });
      return out;
    });
  }

  function readPackages() {
    /* -3 拿第三方；系统应用单独列，方便给 system_server 之类做作用域 */
    return exec('pm list packages -3 2>/dev/null; echo "---"; pm list packages -s 2>/dev/null').then(function (r) {
      var third = [], sys = [];
      var bucket = third;
      r.stdout.split(/\r?\n/).forEach(function (line) {
        var t = line.trim();
        if (t === '---') { bucket = sys; return; }
        if (t.indexOf('package:') !== 0) return;
        var p = t.slice(8);
        if (!p) return;
        (bucket === third ? third : sys).push(p);
      });
      var seen = {};
      third.concat(sys).forEach(function (p) { seen[p] = 1; });
      return { third: third, sys: sys, all: Object.keys(seen) };
    });
  }

  function readRunning() {
    return exec('ps -A -o NAME 2>/dev/null').then(function (r) {
      var set = {};
      r.stdout.split(/\r?\n/).forEach(function (l) {
        var t = l.trim();
        if (t) set[t] = 1;
      });
      return set;
    });
  }

  /* 应用中文名，失败就退回包名 */
  function enrich(pkgs) {
    /* window.ksu 本身可能不存在，不能直接取 .getPackagesInfo */
    if (!window.ksu || typeof window.ksu.getPackagesInfo !== 'function' || !pkgs.length) return {};
    try {
      var arr = JSON.parse(window.ksu.getPackagesInfo(JSON.stringify(pkgs)) || '[]');
      var map = {};
      arr.forEach(function (it) {
        if (it && it.packageName) map[it.packageName] = it.appLabel || '';
      });
      return map;
    } catch (e) { return {}; }
  }

  /* ---------- 渲染 ---------- */

  function visible() {
    var q = query.toLowerCase();
    return all.filter(function (a) {
      if (filter === 'sel' && !selected[a.pkg]) return false;
      if (filter === 'run' && !a.run) return false;
      if (filter === 'sys' && !a.sys) return false;
      if (!q) return true;
      return a.pkg.toLowerCase().indexOf(q) >= 0 || (a.name || '').toLowerCase().indexOf(q) >= 0;
    });
  }

  function row(a) {
    var d = document.createElement('div');
    d.className = 'app' + (selected[a.pkg] ? ' on' : '');

    /* 图标：ksu://icon 取不到就退回方块。用 DOM 属性而不是字符串拼 onerror，
       避免包名里的引号把属性值截断。 */
    var icon = document.createElement('div');
    icon.className = 'icon';
    var img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.src = 'ksu://icon/' + a.pkg;
    img.addEventListener('error', function () {
      img.style.display = 'none';
      var ph = document.createElement('span');
      ph.textContent = '▣';
      icon.appendChild(ph);
    });
    icon.appendChild(img);

    var info = document.createElement('div');
    info.className = 'info';
    var nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = a.name || a.pkg;
    var pk = document.createElement('div');
    pk.className = 'pkg';
    pk.textContent = a.pkg;
    info.appendChild(nm);
    info.appendChild(pk);

    /* 重启按钮：只在已勾选的行出现。它是"改了之后让新作用域生效"的快捷入口。 */
    var btn = document.createElement('button');
    btn.className = 'restart';
    btn.type = 'button';
    btn.title = '重启这个应用';
    btn.textContent = '↻';
    btn.setAttribute('aria-label', '重启 ' + (a.name || a.pkg));
    if (!selected[a.pkg]) { btn.style.display = 'none'; btn.disabled = true; }
    btn.addEventListener('click', function (ev) {
      /* 关键：阻止冒泡，否则会触发行的选中切换 */
      ev.preventDefault();
      ev.stopPropagation();
      restartOne(a.pkg, btn);
    });

    var tick = document.createElement('div');
    tick.className = 'tick';

    d.appendChild(icon);
    d.appendChild(info);
    d.appendChild(btn);
    d.appendChild(tick);

    a._btn = btn;

    d.addEventListener('click', function (ev) {
      ev.preventDefault();
      if (selected[a.pkg]) delete selected[a.pkg];
      else selected[a.pkg] = true;
      var on = !!selected[a.pkg];
      d.classList.toggle('on', on);
      btn.style.display = on ? '' : 'none';
      btn.disabled = !on;
      refreshFoot();
      if (filter === 'sel') render();
    });
    return d;
  }

  /* ---------- 重启 ---------- */

  /* 这些包一旦重启会把当前界面顶掉，需要额外确认语义 */
  var SELF_PKGS = { 'com.dsharnessmobile.shell': 1 };

  /*
   * 生成"重启一个应用"的命令。
   *
   * 用 resolve-activity 把启动入口查出来，再 am start -n 精确拉起。
   *
   * 为什么不用 monkey：monkey 是随机事件生成器，它确实能把应用带起来，
   * 但顺带会往界面上随机打点按事件，可能误触。而且它的退出码
   * 不代表应用真的起来了。resolve-activity + am start -n 是精确的。
   *
   * 为什么中间要 sleep：ams 收进程是异步的。force-stop 之后立刻 start，
   * 有可能命中的是还在退出中的旧进程，等于没重启。
   */
  /*
   * 查启动入口的 shell 片段。
   *
   * resolve-activity 找不到入口时返回的不是空，而是 "No activity found" 这样的句子
   * （实测）。直接把它交给 am start -n 会报错。所以用 case 校验它得像组件名
   * ——必须含斜杠，且不以 No 开头。
   */
  function actOf(pkg) {
    var q = shq(pkg);
    return 'ACT=$(cmd package resolve-activity --brief -c android.intent.category.LAUNCHER ' + q +
           ' 2>/dev/null | tail -n 1); ' +
           'case "$ACT" in ' +
           '*/?*) am start -n "$ACT" >/dev/null 2>&1 ;; ' +
           'esac; ';
  }

  function buildRestartCmd(pkg) {
    var q = shq(pkg);
    return 'am force-stop ' + q + '; sleep 1; ' +
           actOf(pkg) +
           'sleep 1; ' +
           'if pidof ' + q + ' >/dev/null 2>&1; then echo AHBUP; else echo AHBGONE; fi';
  }

  function restartOne(pkg, btn) {
    if (!hasKsu()) { toast('没有 KernelSU 桥，无法重启', 'err'); return; }
    if (btn) { btn.classList.add('busy'); btn.innerHTML = '<span></span>'; btn.disabled = true; }

    exec(buildRestartCmd(pkg)).then(function (r) {
      if (btn) { btn.classList.remove('busy'); btn.textContent = '↻'; btn.disabled = false; }
      var up = r.stdout.indexOf('AHBUP') >= 0;
      var label = labelOf(pkg);
      if (up) toast('已重启 ' + label, 'ok', 2400);
      else toast(label + ' 已停止，但它没有可启动的界面', 'warn', 3400);
    });
  }

  /* 批量重启已选应用，跳过自己 */
  function restartAll() {
    var pkgs = Object.keys(selected).sort();
    if (!pkgs.length) { toast('还没有选中任何应用', 'warn'); return; }
    if (!hasKsu()) { toast('没有 KernelSU 桥，无法重启', 'err'); return; }

    var self = pkgs.filter(function (p) { return SELF_PKGS[p]; });
    var todo = pkgs.filter(function (p) { return !SELF_PKGS[p]; });

    if (self.length && todo.length === 0) {
      toast('作用域里只有本应用自身，重启会把当前界面关掉，已跳过', 'warn', 3600);
      return;
    }

    var btn = $('restart-all');
    btn.disabled = true;
    btn.textContent = '重启中…';

    /* 串起来跑，避免多条 am 并发打架 */
    var cmd = '';
    todo.forEach(function (p) { cmd += 'am force-stop ' + shq(p) + '; '; });
    cmd += 'sleep 1; ';
    todo.forEach(function (p) { cmd += actOf(p); });
    cmd += 'sleep 1; echo AHBDONE';

    exec(cmd).then(function (r) {
      btn.disabled = false;
      btn.textContent = '重启已选';
      var skipped = self.length ? ('，跳过 ' + self.map(labelOf).join('、')) : '';
      if (r.stdout.indexOf('AHBDONE') >= 0) {
        toast('已重启 ' + todo.length + ' 个应用' + skipped, 'ok', 3400);
      } else if (r.code !== 0) {
        /* 真失败：命令本身报错了，把 stderr 给用户 */
        toast('重启失败：' + String(r.stderr || ('code ' + r.code)).slice(0, 100), 'err', 4000);
      } else {
        /*
         * code 0 却没有结束标记，说明命令跑完了但输出被截断或没走到最后一行。
         * 这时不能报"失败：code 0"——那句话对用户没有任何信息量。
         * 应用该重启的已经重启了，如实说明即可。
         */
        toast('已下发重启命令，但没有收到完成回执。请看一下那些应用是否已重新打开。', 'warn', 4000);
      }
      refreshFoot();
    });
  }

  function render() {
    var list = $('list');
    var rows = visible();
    list.innerHTML = '';
    if (!rows.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = filter === 'sel'
        ? '还没有选中任何应用。切到「全部」，点选要生效的应用。'
        : (loaded ? '没有匹配的应用' : '正在读取…');
      list.appendChild(e);
      return;
    }

    var cut = rows.slice(0, shown);
    var wrap = document.createElement('div');
    wrap.className = 'list';
    cut.forEach(function (a) { wrap.appendChild(row(a)); });
    list.appendChild(wrap);

    /* 还有没渲染完的，给个按钮继续 */
    if (rows.length > cut.length) {
      var more = document.createElement('button');
      more.id = 'more';
      more.type = 'button';
      more.textContent = '显示更多（还剩 ' + (rows.length - cut.length) + ' 个）';
      more.style.cssText = 'width:100%;margin-top:10px;padding:12px;font-size:14px';
      more.addEventListener('click', function () {
        shown += PAGE * 4;   /* 点一次多给一些，免得点几十次 */
        render();
      });
      list.appendChild(more);
    }
  }

  function dirty() {
    var a = Object.keys(selected).sort().join('\n');
    var b = Object.keys(initial).sort().join('\n');
    return a !== b;
  }

  function refreshFoot() {
    var n = Object.keys(selected).length;
    $('cnt').textContent = n + ' 个应用已选';
    $('n-sel').textContent = String(n);
    $('n-all').textContent = String(all.length);
    $('save').disabled = !dirty();
    $('save').textContent = dirty() ? '保存' : '已保存';
    /* 批量重启只在有能力且选了应用时可用 */
    $('restart-all').disabled = !hasKsu() || n === 0;
  }

  /* ---------- 写 ---------- */

  function save() {
    var btn = $('save');
    btn.disabled = true;
    btn.textContent = '保存中…';

    var pkgs = Object.keys(selected).sort();
    var body = '# AntiHook Bypass 作用域：一行一个包名，前缀匹配\n' +
               '# 改完不需要重编、不需要重启，重开目标应用即可\n' +
               pkgs.join('\n') + (pkgs.length ? '\n' : '');

    /* 用临时文件 + 原子改名，避免写一半断电留下残缺文件 */
    var tmp = '/data/local/tmp/.ahb_scope.$$';
    var cmd =
      'printf %s ' + shq(body) + ' > ' + tmp + ' && ' +
      'mkdir -p /data/adb/modules/' + MODULE_ID + ' && ' +
      'cp ' + tmp + ' ' + shq(SCOPE) + ' && ' +
      'chmod 644 ' + shq(SCOPE) + ' && ' +
      'rm -f ' + tmp + ' && echo OK';

    exec(cmd).then(function (r) {
      var ok = r.code === 0 && r.stdout.indexOf('OK') >= 0;
      /* 回读确认，不能只信命令退出码 */
      return readScope().then(function (back) {
        var same = back.length === pkgs.length &&
                   back.every(function (p, i) { return p === pkgs[i]; });
        if (ok && same) {
          initial = {};
          pkgs.forEach(function (p) { initial[p] = true; });
          toast('已保存 ' + pkgs.length + ' 个应用。重开目标应用后生效。', 'ok', 3400);
        } else if (ok) {
          toast('写入后回读不一致，请刷新确认：' + back.length + ' 条', 'warn', 4000);
        } else {
          toast('保存失败：' + (r.stderr || r.stdout || ('code ' + r.code)).slice(0, 120), 'err', 4200);
        }
        refreshFoot();
      });
    });
  }

  /* ---------- 启动 ---------- */

  function boot() {
    $('head').textContent = hasKsu() ? 'Zygisk 作用域管理' : '未检测到 KernelSU 桥，无法读写';

    Promise.all([readScope(), readPackages(), readRunning()]).then(function (res) {
      var scope = res[0], pk = res[1], run = res[2];

      scope.forEach(function (p) { selected[p] = true; initial[p] = true; });

      var base = pk.all.slice();
      /* 已选但不在安装列表里的包（比如刚卸载）也列出来，否则用户没法取消它 */
      scope.forEach(function (p) { if (base.indexOf(p) < 0) base.push(p); });

      var labels = enrich(base.filter(function (p) { return pk.all.indexOf(p) >= 0; }));
      var sysSet = {};
      pk.sys.forEach(function (p) { sysSet[p] = 1; });

      all = base.map(function (p) {
        return {
          pkg: p,
          name: labels[p] || p,
          sys: !!sysSet[p],
          run: !!run[p]
        };
      }).sort(function (x, y) {
        /* 已选优先，其次运行中，再按名字 */
        var xs = selected[x.pkg] ? 0 : 1, ys = selected[y.pkg] ? 0 : 1;
        if (xs !== ys) return xs - ys;
        if (x.run !== y.run) return x.run ? -1 : 1;
        return (x.name || x.pkg).localeCompare(y.name || y.pkg, 'zh');
      });

      loaded = true;
      shown = PAGE;
      if (!scope.length) filter = 'all';
      syncTabs();
      render();
      refreshFoot();
      $('refresh').disabled = false;
    }).catch(function (e) {
      $('list').innerHTML = '<div class="empty">读取失败：' + String(e).slice(0, 160) + '</div>';
    });
  }

  function syncTabs() {
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
      t.classList.toggle('on', t.getAttribute('data-f') === filter);
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () {
      filter = t.getAttribute('data-f');
      shown = PAGE;
      syncTabs();
      render();
    });
  });

  $('q').addEventListener('input', function (e) {
    query = e.target.value.trim();
    shown = PAGE;
    render();
  });

  $('save').addEventListener('click', save);
  $('restart-all').addEventListener('click', restartAll);

  $('refresh').addEventListener('click', function () {
    $('refresh').disabled = true;
    var keep = {};
    Object.keys(selected).forEach(function (k) { keep[k] = 1; });
    all = [];
    loaded = false;
    $('list').innerHTML = '<div class="empty"><span class="spin"></span>正在重新读取…</div>';
    boot();
    /* boot 会重建 selected，这里把用户未保存的选择补回去 */
    setTimeout(function () {
      Object.keys(keep).forEach(function (k) { selected[k] = true; });
      render(); refreshFoot();
    }, 50);
  });

  boot();
})();
</script>
</body>
</html>
